- assertVisible:
    text: "Search transactions"
    focused: true
- inputText: "Rahul S"
- assertVisible:
    text: "^Rahul S$"
    focused: true
- assertVisible: "Clear search"
- assertNotVisible:
    id: "transaction-sample-0"
# Submit only after proving focus/input belong to Kanakku, then open the result.
- pressKey: Enter
- assertVisible:
