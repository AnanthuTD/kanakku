appId: app.tinkerbox.kanakku.e2e
name: Sample review correction persists after app restart
---
- launchApp:
    clearState: true
    permissions:
      android.permission.READ_SMS: deny
      android.permission.RECEIVE_SMS: deny
      android.permission.RECORD_AUDIO: deny
      android.permission.POST_NOTIFICATIONS: deny
      android.permission.READ_EXTERNAL_STORAGE: deny
      android.permission.WRITE_EXTERNAL_STORAGE: deny
- runFlow: ../common/skip-welcome.yaml
- extendedWaitUntil:
    visible: "This month"
    timeout: 120000
- assertVisible: "This month"
- tapOn:
    text: "Activity"
    waitToSettleTimeoutMs: 1000
- tapOn:
    id: "transaction-search"
    waitToSettleTimeoutMs: 1000
- assertVisible:
    id: "transaction-search"
    focused: true
- inputText: "Rahul S"
- assertVisible:
    id: "transaction-search"
    focused: true
- assertVisible: "Clear search"
- assertNotVisible:
    id: "transaction-sample-0"
# Submit only after proving focus/input belong to Kanakku, then open the result.
- pressKey: Enter
- assertVisible:
    id: "activity-count"
    text: "1 TRANSACTIONS"
- assertVisible:
    id: "transaction-sample-1"
- tapOn:
    waitToSettleTimeoutMs: 1000
    id: "transaction-sample-1"
- assertVisible: "What was this for?"
- tapOn:
    id: "payment-note"
    waitToSettleTimeoutMs: 1000
- assertVisible:
    id: "payment-note"
    focused: true
- inputText: "auto to office"
- assertVisible:
    id: "payment-note"
    focused: true
- hideKeyboard
- assertVisible: "auto to office"
- scrollUntilVisible:
    element: "Save category"
    direction: DOWN
    timeout: 60000
    waitToSettleTimeoutMs: 1000
- tapOn:
    text: "Save category"
    waitToSettleTimeoutMs: 1000
# Verify committed state; the brief Saved notice can expire during UI settling.
- assertVisible: "Categorization: Confirmed by you.*"
- scrollUntilVisible:
    element: "Close transaction"
    direction: UP
    timeout: 60000
    waitToSettleTimeoutMs: 1000
- tapOn:
    text: "Close transaction"
    waitToSettleTimeoutMs: 1000
- launchApp:
    permissions:
      android.permission.READ_SMS: deny
      android.permission.RECEIVE_SMS: deny
      android.permission.RECORD_AUDIO: deny
      android.permission.POST_NOTIFICATIONS: deny
      android.permission.READ_EXTERNAL_STORAGE: deny
      android.permission.WRITE_EXTERNAL_STORAGE: deny
- extendedWaitUntil:
    visible: "This month"
    timeout: 120000
- tapOn:
    text: "Activity"
    waitToSettleTimeoutMs: 1000
- tapOn:
    id: "transaction-search"
    waitToSettleTimeoutMs: 1000
- assertVisible:
    id: "transaction-search"
    focused: true
- inputText: "Rahul S"
- assertVisible:
    id: "transaction-search"
    focused: true
- assertVisible: "Clear search"
- assertNotVisible:
    id: "transaction-sample-0"
# Submit only after proving focus/input belong to Kanakku, then open the result.
- pressKey: Enter
- assertVisible:
    id: "activity-count"
    text: "1 TRANSACTIONS"
- assertVisible:
    id: "transaction-sample-1"
- tapOn:
    waitToSettleTimeoutMs: 1000
    id: "transaction-sample-1"
- assertVisible: "TRANSACTION DETAILS"
- scrollUntilVisible:
    element: "auto to office"
    timeout: 60000
    waitToSettleTimeoutMs: 1000
- assertVisible: "auto to office"
