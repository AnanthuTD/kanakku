appId: app.tinkerbox.kanakku.e2e
name: First-run welcome connects bank SMS with "Open without asking"
---
- launchApp
- extendedWaitUntil:
    visible: "Your bank SMS, turned into a private spend journal."
    timeout: 120000
- tapOn: "Get started"
- assertVisible: "How should Kanakku open?"
- tapOn:
    id: "lock-choice-open"
- tapOn: "Continue"
- assertVisible: "Used Kanakku before?"
- tapOn: "No, start fresh"
- assertVisible: "Where do your bank alerts come from?"
- assertVisible:
    id: "source-sms"
    checked: true
- scrollUntilVisible:
    element: "4 months"
- tapOn: "4 months"
- scrollUntilVisible:
    element: "Allow access and continue"
- tapOn: "Allow access and continue"
- extendedWaitUntil:
    visible: "You're set."
    timeout: 60000
- assertNotVisible:
    id: ".*(pinEntry|lockPassword)"
- assertNotVisible: "Set a recovery password"
- tapOn: "Go to my journal"
- extendedWaitUntil:
    visible: "This month"
    timeout: 30000
