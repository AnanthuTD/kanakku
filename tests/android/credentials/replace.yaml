appId: com.kanakku.app.e2e
name: Synthetic disabled provider credential replace
---
# Continues from restart.yaml; the harness inspects persisted native bytes first.
- scrollUntilVisible:
    element: "Brave Search API key"
    direction: UP
    timeout: 60000
- tapOn:
    text: "Brave Search API key"
    waitToSettleTimeoutMs: 1000
- inputText: "KANAKKU_TEST_INVALID_KEY_BETA_0000"
- pressKey: Enter
- scrollUntilVisible:
    element: "Save merchant lookup preferences"
    timeout: 60000
- tapOn:
    text: "Save merchant lookup preferences"
    waitToSettleTimeoutMs: 1000
- scrollUntilVisible:
    element: "Remove provider key"
    timeout: 60000
- assertVisible: "Remove provider key"
- scrollUntilVisible:
    element: "Local safety caps: 0/20 attempts today.*"
    timeout: 60000
- assertVisible: "Local safety caps: 0/20 attempts today.*"
- assertNotVisible: "Search this business"
