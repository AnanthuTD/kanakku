appId: app.tinkerbox.kanakku.e2e
name: Synthetic disabled provider credential save-first
---
- launchApp:
    clearState: true
    permissions:
      android.permission.READ_SMS: deny
      android.permission.RECEIVE_SMS: deny
      android.permission.RECORD_AUDIO: deny
      android.permission.POST_NOTIFICATIONS: deny
      android.permission.READ_EXTERNAL_STORAGE: deny
      android.permission.WRITE_EXTERNAL_STORAGE: deny
- runFlow: ../common/skip-welcome.yaml
- extendedWaitUntil:
    visible: "Open settings"
    timeout: 120000
- tapOn:
    text: "Open settings"
    waitToSettleTimeoutMs: 1000
- scrollUntilVisible:
    element: "Brave Search API key"
    timeout: 60000
- tapOn:
    text: "Brave Search API key"
    waitToSettleTimeoutMs: 1000
- inputText: "KANAKKU_TEST_INVALID_KEY_ALPHA_000"
- pressKey: Enter
- scrollUntilVisible:
    element: "Save merchant lookup preferences"
    timeout: 60000
- tapOn:
    text: "Save merchant lookup preferences"
    waitToSettleTimeoutMs: 1000
- scrollUntilVisible:
    element: "Remove provider key"
    timeout: 60000
- assertVisible: "Remove provider key"
- scrollUntilVisible:
    element: "Local safety caps: 0/20 attempts today.*"
    timeout: 60000
- assertVisible: "Local safety caps: 0/20 attempts today.*"
- assertNotVisible: "Search this business"
