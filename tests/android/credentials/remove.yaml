appId: com.kanakku.app.e2e
name: Synthetic provider credential remove
---
# Continues from replace.yaml after the harness verifies encrypted replacement.
- scrollUntilVisible:
    element: "Remove provider key"
    direction: UP
    timeout: 60000
- tapOn:
    text: "Remove provider key"
    waitToSettleTimeoutMs: 1000
- extendedWaitUntil:
    notVisible: "Remove provider key"
    timeout: 30000
- assertNotVisible: "Search this business"
