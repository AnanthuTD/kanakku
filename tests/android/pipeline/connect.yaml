appId: app.tinkerbox.kanakku.e2e
name: Synthetic provider import with real device authentication
---
- launchApp:
    permissions:
      android.permission.READ_SMS: allow
      android.permission.RECEIVE_SMS: allow
      android.permission.POST_NOTIFICATIONS: allow
      android.permission.RECORD_AUDIO: deny
      android.permission.READ_EXTERNAL_STORAGE: deny
      android.permission.WRITE_EXTERNAL_STORAGE: deny
- runFlow: ../common/skip-welcome.yaml
- extendedWaitUntil:
    visible: "Open settings"
    timeout: 120000
- tapOn:
    text: "Open settings"
    waitToSettleTimeoutMs: 1000
- tapOn:
    text: "Bank alerts & import"
    waitToSettleTimeoutMs: 1000
- scrollUntilVisible:
    element: "Connect bank SMS"
    timeout: 60000
- tapOn:
    text: "Connect bank SMS"
    waitToSettleTimeoutMs: 1000
- scrollUntilVisible:
    element: "4 months"
    timeout: 60000
- tapOn:
    text: "4 months"
    waitToSettleTimeoutMs: 1000
- scrollUntilVisible:
    element: "Continue with Android permissions"
    timeout: 60000
- tapOn:
    text: "Continue with Android permissions"
    waitToSettleTimeoutMs: 1000
- extendedWaitUntil:
    visible:
      id: ".*(pinEntry|lockPassword)"
    timeout: 30000
- inputText: "2580"
- pressKey: Enter
# The import banner hides once the journal has absorbed the import, so wait for the connected
# state here; the exact Overview total below (and the harness's native status) prove the import.
- extendedWaitUntil:
    visible: "Capture new transaction alerts"
    timeout: 60000
- tapOn:
    text: "Back to settings"
    waitToSettleTimeoutMs: 1000
- tapOn:
    text: "Back to overview"
    waitToSettleTimeoutMs: 1000
- extendedWaitUntil:
    visible:
      id: "overview-total"
      text: "₹300.25"
    timeout: 180000
