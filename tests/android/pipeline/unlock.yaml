appId: app.tinkerbox.kanakku.e2e
name: Reauthenticate to load staged synthetic alerts
---
- assertVisible: "Unlock Kanakku"
- extendedWaitUntil:
    visible:
      id: ".*(pinEntry|lockPassword)"
    timeout: 30000
- inputText: "2580"
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: "overview-total"
      text: "₹300.25"
    timeout: 30000
