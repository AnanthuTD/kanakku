apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'

group = 'expo.modules.kanakku'
version = '0.1.0'
android {
  namespace 'expo.modules.kanakku'
  defaultConfig {
    minSdkVersion 31; versionCode 1; versionName '0.1.0'
    testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    ndk { abiFilters 'arm64-v8a' }
    externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared'; cppFlags '-O3' } }
  }
  externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
  ndkVersion '27.1.12297006'
  testOptions { unitTests.returnDefaultValues = true }
}
dependencies {
  // Bundled Latin-script OCR: works on first use without a model download or image upload.
  implementation 'com.google.mlkit:text-recognition:16.0.1'
  implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.31.0'
  implementation 'androidx.biometric:biometric:1.1.0'
  implementation 'androidx.core:core-ktx:1.15.0'
  implementation 'androidx.work:work-runtime-ktx:2.10.5'
  testImplementation 'junit:junit:4.13.2'
  androidTestImplementation 'androidx.test:runner:1.7.0'
  androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
